name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # This job handles BOTH the real prod deploy (push to main) and Azure SWA's
    # PR preview deploys - only the former should count as "production" for
    # GitHub Environment protection rules (e.g. required reviewers), so the
    # environment name is conditional. GitHub creates an Environment
    # automatically on first reference if it doesn't already exist in
    # Settings -> Environments.
    environment:
      name: ${{ github.event_name == 'push' && 'production' || 'preview' }}
    # Build ręcznie (nie przez Oryx w akcji SWA), bo trzeba wstrzyknąć
    # PACKAGES_READ_TOKEN jako GITHUB_TOKEN dla rejestru @szczypkaweb
    # (npm.pkg.github.com) — patrz .npmrc w tym repo, które czyta
    # `${GITHUB_TOKEN}` wprost.
    #
    # Musi być na poziomie JOBA, nie pojedynczego stepa: .npmrc zacommitowany
    # w repo ma najwyższy priorytet przy odczycie configu pnpm i nadpisuje z
    # powrotem cokolwiek ustawi `pnpm config set` w osobnym stepie (dokładnie
    # ten sam błąd, który mieliśmy przy `changeset publish` dla shared-ui) -
    # jedyny sposób żeby `${GITHUB_TOKEN}` w .npmrc faktycznie się podstawił
    # to mieć tę zmienną w env całego joba, żeby `pnpm install` widział ją
    # bezpośrednio, bez pośredniczącego `pnpm config set`.
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Deploy to Azure Static Web Apps
        id: deploy
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true

      # frontend-shell doesn't have its own Azure workflow yet (see task #8),
      # so there's nowhere to auto-inject this as REACT_APP_REMOTE_URL. Until
      # that exists, surface it here so whoever sets frontend-shell's build
      # env (or that future workflow) knows the exact value to use - this app
      # is a Module Federation remote (see webpack.config.ts), and
      # frontend-shell needs this URL to find its remoteEntry.js at
      # `${REACT_APP_REMOTE_URL}/remoteEntry.js` (defaults to
      # http://localhost:8081 otherwise, which only works in local dev).
      - name: Surface deployed URL for frontend-shell's REACT_APP_REMOTE_URL
        if: github.event_name == 'push'
        run: |
          echo "### react-app deployed" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set frontend-shell's build-time \`REACT_APP_REMOTE_URL\` to:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.static_web_app_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
