name: Azure Static Web Apps CI/CD

on:
  push:
    branches: [main, staging]
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main]

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    runs-on: ubuntu-latest
    name: Build and Deploy Job
    # Three cases now, not two: prod (push main), staging (push staging),
    # PR preview (Azure's own ephemeral-per-PR mechanism, unrelated to the
    # `staging` branch). Only prod should count as "production" for GitHub
    # Environment protection rules (required reviewers etc.). GitHub creates
    # an Environment automatically on first reference if it doesn't exist yet
    # in Settings -> Environments.
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/staging' && 'staging' || 'preview') }}
    # Manual build (not via Oryx in the SWA action), because
    # PACKAGES_READ_TOKEN needs to be injected as the auth token for the
    # @szczypkaweb registry (npm.pkg.github.com) — see .npmrc in this repo.
    #
    # pnpm DELIBERATELY ignores `${GITHUB_TOKEN}` in a .npmrc committed to
    # the repo, regardless of whether that variable is set at job or step
    # level — this is a deliberate pnpm safeguard (a project .npmrc is
    # "untrusted" for credentials, because someone could swap it and steal
    # the token via a substituted registry; see the "Ignored project-level
    # auth setting..." warning / https://pnpm.io/npmrc). The only way to
    # actually make the token work is to set it explicitly via
    # `pnpm config set` (user-level config) in a separate step BEFORE
    # `pnpm install` - exactly what pnpm itself suggests in that warning.
    env:
      GITHUB_TOKEN: ${{ secrets.PACKAGES_READ_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Enable Corepack (pnpm)
        run: corepack enable

      - name: Configure registry auth
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Lint + Vitest in the same job as the build/deploy, for the same
      # reason as frontend-shell's workflow: one required status check
      # ("Build and Deploy Job") instead of two kept in sync separately.
      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      # Own Sentry project, separate from frontend-shell's - see
      # BLOG_NOTES.md for why (clearest error attribution between the two
      # apps, matches the existing one-project-per-app convention). Not a
      # secret - see the matching comment in frontend-shell's workflow.
      - name: Build
        run: pnpm build
        env:
          SENTRY_DSN: ${{ vars.SENTRY_DSN }}
          SENTRY_ENVIRONMENT: ${{ github.ref == 'refs/heads/main' && 'production' || (github.ref == 'refs/heads/staging' && 'staging' || 'preview') }}
          SENTRY_RELEASE: ${{ github.sha }}

      # `deployment_environment` gives the `staging` branch a STABLE, PERSISTENT
      # URL on this same SWA resource (<default-host>-staging.<region>.azure-
      # staticapps.net) - not the ephemeral per-PR preview mechanism above,
      # and no second Azure resource/cost. Empty string on prod/PR pushes -
      # that's the SDK's own no-override value, so those keep deploying to
      # the normal production/preview slots.
      # https://learn.microsoft.com/en-us/azure/static-web-apps/named-environments
      # `if:` guard, not `skip_deploy_on_missing_secrets` (removed - that
      # input is silently ignored: `@v1`'s actual "valid inputs" list doesn't
      # include it, and it's a long-standing, still-open bug in the action
      # itself - github.com/Azure/static-web-apps/issues/679, open since
      # 2022, hard-fails with "deployment_token was not provided" regardless
      # of the setting). Skip the step at the GitHub Actions level instead,
      # before the action ever runs: workflow runs triggered by Dependabot
      # (pull_request, actor dependabot[bot]) only get Dependabot secrets, not
      # regular Actions secrets - AZURE_STATIC_WEB_APPS_API_TOKEN comes back
      # empty in that context, and this step would otherwise hard-fail the
      # whole job over a step that a dependency-bump PR never actually needs
      # (it only needs build/lint/test to pass, not a real deploy).
      - name: Deploy to Azure Static Web Apps
        id: deploy
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "dist"
          api_location: ""
          output_location: ""
          skip_app_build: true
          deployment_environment: ${{ github.ref == 'refs/heads/staging' && 'staging' || '' }}

      # This app is a Module Federation remote (see webpack.config.ts) -
      # frontend-shell needs to know its URL to find `remoteEntry.js`
      # (defaults to http://localhost:8081 otherwise, local-dev only).
      # Deliberately NOT auto-wired: frontend-shell reads it from its own
      # repo Variable (`REACT_APP_REMOTE_URL` / `REACT_APP_REMOTE_URL_STAGING`),
      # set manually once per environment - see infra/RUNBOOK.md section 3 for
      # why cross-repo URL propagation isn't automated yet (no custom domain).
      # This step just surfaces the value so it's easy to copy after a change
      # (new region, resource recreated, etc).
      - name: Surface deployed URL for frontend-shell's REACT_APP_REMOTE_URL(_STAGING)
        if: github.event_name == 'push'
        run: |
          echo "### react-app deployed (${{ github.ref == 'refs/heads/staging' && 'staging' || 'production' }})" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Set frontend-shell's build-time \`REACT_APP_REMOTE_URL${{ github.ref == 'refs/heads/staging' && '_STAGING' || '' }}\` to:" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deploy.outputs.static_web_app_url }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

  # Re-validates the shared staging stack against whatever this staging push
  # just changed - a react-app-only change never redeploys frontend-shell
  # (Module Federation loads remoteEntry.js at RUNTIME, not build time), so
  # without this, a react-app regression on staging would go unnoticed until
  # someone happened to also push frontend-shell or backend.
  #
  # Requires (Settings -> Secrets and variables -> Actions, this repo):
  #   Variables: FRONTEND_SHELL_STAGING_URL, BACKEND_STAGING_URL
  #   Secrets:   E2E_DATABASE_URL_STAGING (optional - omitted = 'app' project
  #              in e2e-tests is safely skipped, only marketing+flows run)
  #              E2E_REPO_PAT (required - fine-grained PAT, Contents:
  #              Read-only on marketplace-e2e; lets e2e-tests' own checkout
  #              step read its own repo when invoked from here, since the
  #              ambient GITHUB_TOKEN in this run's context can't. Separate
  #              from the "Actions -> Access" org permission below, which
  #              only allows the workflow_call itself, not the checkout.)
  # Also requires e2e-tests (marketplace-e2e) to allow Actions access from
  # this repo under Settings -> Actions -> Access.
  e2e:
    needs: build_and_deploy_job
    if: github.ref == 'refs/heads/staging'
    uses: szczypkaweb/marketplace-e2e/.github/workflows/e2e.yml@main
    with:
      app_url: ${{ vars.FRONTEND_SHELL_STAGING_URL }}
      api_url: ${{ vars.BACKEND_STAGING_URL }}
    secrets:
      E2E_DATABASE_URL: ${{ secrets.E2E_DATABASE_URL_STAGING }}
      E2E_REPO_CHECKOUT_TOKEN: ${{ secrets.E2E_REPO_PAT }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        if: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN != '' }}
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: "close"
          skip_deploy_on_missing_secrets: true
